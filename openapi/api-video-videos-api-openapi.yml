openapi: 3.2.0
info:
  title: Videos API
  version: '1.0'
  description: 'Operations tagged Videos across 2 of this provider''s published API definitions: api-video-openapi.yml, api-video-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://ws.api.video
  description: Production server
- url: https://sandbox.api.video
  description: Test server `all videos are watermarked, and deleted after 24 hours.
tags:
- name: Videos
paths:
  /videos:
    get:
      tags:
      - Videos
      summary: List all video objects
      description: List all the video objects that are associated with the current workspace.
      x-client-description:
        default: This method returns a list of your videos (with all their details). With no parameters added, the API returns the first page of all videos. You can filter videos using the parameters described below.
      operationId: LIST-videos
      parameters:
      - name: title
        in: query
        description: The title of a specific video you want to find. The search will match exactly to what term you provide and return any videos that contain the same term as part of their titles.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: My Video.mp4
      - name: tags[]
        in: query
        description: A tag is a category you create and apply to videos. You can search for videos with particular tags by listing one or more here. Only videos that have all the tags you list will be returned.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example: '["captions", "dialogue"]'
      - name: metadata
        in: query
        description: Videos can be tagged with metadata tags in key:value pairs. You can search for videos with specific key value pairs using this parameter.
        required: false
        style: deepObject
        x-is-deep-object: true
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
        example: metadata[Author]=John Doe&metadata[Format]=Tutorial
      - name: description
        in: query
        description: Retrieve video objects by `description`.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: New Zealand
      - name: liveStreamId
        in: query
        description: Retrieve video objects that were recorded from a live stream by `liveStreamId`.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: li400mYKSgQ6xs7taUeSaEKr
      - name: sortBy
        in: query
        description: Use this parameter to sort videos by the their created time, published time, updated time, or by title.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - title
          - createdAt
          - publishedAt
          - updatedAt
        example: publishedAt
      - name: sortOrder
        in: query
        description: Use this parameter to sort results. `asc` is ascending and sorts from A to Z. `desc` is descending and sorts from Z to A.
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - asc
          - desc
        example: asc
      - $ref: '#/components/parameters/current-page'
      - $ref: '#/components/parameters/page-size'
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/videos-list-response'
              examples:
                response:
                  value:
                    data:
                    - videoId: vi4blUQJFrYWbaG44NChkH27
                      playerId: pl45KFKdlddgk654dspkze
                      title: Maths video
                      description: An amazing video explaining the string theory
                      language: en
                      languageOrigin: api
                      public: false
                      panoramic: false
                      mp4Support: true
                      tags:
                      - maths
                      - string theory
                      - video
                      metadata:
                      - key: Author
                        value: John Doe
                      - key: Format
                        value: Tutorial
                      publishedAt: '2019-12-16T08:25:51+00:00'
                      updatedAt: '2019-12-16T08:48:49+00:00'
                      discarded: false
                      discardedAt: null
                      deletesAt: null
                      source:
                        uri: /videos/c188ed58-3403-46a2-b91b-44603d10b2c9/source
                      assets:
                        iframe: <iframe src="https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen=""></iframe>
                        player: https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27
                        hls: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/hls/manifest.m3u8
                        thumbnail: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/thumbnail.jpg
                        mp4: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/mp4/source.mp4
                    - videoId: vi4blUQJFrYWbaG44NChkH27
                      title: Video Title
                      description: A description for your video.
                      language: en
                      languageOrigin: api
                      public: false
                      panoramic: false
                      mp4Support: true
                      tags:
                      - books
                      - short stories
                      metadata:
                      - key: Author
                        value: John Doe
                      - key: Science Fiction
                        value: Cyberpunk
                      - key: Technology
                        value: Computers
                      publishedAt: '2019-12-16T08:25:51+00:00'
                      updatedAt: '2019-12-16T08:48:49+00:00'
                      discarded: false
                      discardedAt: null
                      deletesAt: null
                      source:
                        uri: /videos/vi4blUQJFrYWbaG44NChkH27/source
                      assets:
                        iframe: <iframe src="https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen=""></iframe>
                        player: https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27
                        hls: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/hls/manifest.m3u8
                        thumbnail: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/thumbnail.jpg
                        mp4: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/mp4/source.mp4
                    - videoId: vi4blUQJFrYWbaG44NChkH27
                      playerId: pl45KFKdlddgk654dspkze
                      title: My Video Title
                      description: A brief description of the video.
                      language: fr
                      languageOrigin: api
                      public: false
                      panoramic: false
                      mp4Support: true
                      tags:
                      - General
                      - Videos
                      metadata:
                      - key: Length
                        value: Short
                      publishedAt: '2019-12-16T08:25:51+00:00'
                      updatedAt: '2019-12-16T08:48:49+00:00'
                      discarded: false
                      discardedAt: null
                      deletesAt: null
                      source:
                        uri: /videos/vi4blUQJFrYWbaG44NChkH27/source
                      assets:
                        iframe: <iframe src="https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen=""></iframe>
                        player: https://embed.api.video/vod/vi4blUQJFrYWbaG44NChkH27
                        hls: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/hls/manifest.m3u8
                        thumbnail: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/thumbnail.jpg
                        mp4: https://cdn.api.video/vod/vi4blUQJFrYWbaG44NChkH27/mp4/source.mp4
                    pagination:
                      currentPage: 1
                      pageSize: 25
                      pagesTotal: 1
                      itemsTotal: 11
                      currentPageItems: 11
                      links:
                      - rel: self
                        uri: https://ws.api.video/videos?currentPage=1
                      - rel: first
                        uri: https://ws.api.video/videos?currentPage=1
                      - rel: last
                        uri: https://ws.api.video/videos?currentPage=1
        '400':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bad-request'
              examples:
                response:
                  value:
                    title: This parameter is out of the allowed range of values.
                    name: page
                    status: 400
                    range:
                      min: 1
                    problems:
                    - title: This parameter is out of the allowed range of values.
                      name: page
                      range:
                        min: 1
                    - title: This parameter is out of the allowed range of values.
                      name: pageSize
                      range:
                        min: 10
                        max: 100
        '429':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/too-many-requests'
              examples:
                Too many requests:
                  value:
                    type: https://docs.api.video/reference/too-many-requests
                    title: Too many requests.
                    status: 429
      security:
      - apiKey: []
      x-doctave:
        code-samples:
        - language: php
          code: "<?php\n// First install the api client: \"composer require api-video/php-api-client\"\n// Documentation: https://github.com/apivideo/api.video-php-client/blob/main/docs/Api/VideosApi.md#list\n\nrequire __DIR__ . '/vendor/autoload.php';\n\n\n$client = new \\ApiVideo\\Client\\Client(\n    'https://ws.api.video',\n    'YOUR_API_KEY',\n    new \\Symfony\\Component\\HttpClient\\Psr18Client()\n);\n\n// list all videos (all pages)\n$allVideos = [];\ndo {\n    $currentPage = $client->videos()->list([]);\n    $allVideos = array_merge($allVideos, $currentPage->getData());\n} while($currentPage->getPagination()->getCurrentPage() < $currentPage->getPagination()->getPagesTotal());\n\n// list videos that have all the given tags (only first results page)\n$videosWithTag = $client->videos()->list(['tags' => ['TAG2','TAG1']]);\n\n// list videos that have all the given metadata values (only first results page)\n$videosWithMetadata = $client->videos()->list(['metadata' => ['key1' => 'key1value1', 'key2' => 'key2value1']]);\n"
        - language: java
          code: "// First add the \"video.api:java-api-client\" maven dependency to your project\n// Documentation: https://github.com/apivideo/api.video-java-client/blob/main/docs/VideosApi.md#list\n\nApiVideoClient client = new ApiVideoClient(\"YOUR_API_KEY\");\nVideosApi videosApi = client.videos();\n\n// list all videos (all pages)\nPage<Video> videosPages = videosApi.list().execute();\nvideosPages.forEach(videosPage -> videosPage.getItems().forEach(video ->\n    System.out.println(video.getVideoId())\n));\n\n// list videos that have all the given tags (only first results page)\nList<Video> videosWithTags = videosApi.list()\n    .tags(Arrays.asList(\"tag1\", \"tag2\"))\n    .execute()\n    .getItems();\n\n// list videos that have all the given metadata values (only first results page)\nList<Video> videosWithMetadata = videosApi.list()\n    .metadata(Map.of(\"key1\", \"value1\", \"key2\", \"value2\"))\n    .execute()\n    .getItems();"
        - language: node
          code: "// First install the \"@api.video/nodejs-client\" npm package\n// Documentation: https://github.com/apivideo/api.video-nodejs-client/blob/main/doc/api/VideosApi.md#list\n\nconst client = new ApiVideoClient({ apiKey: \"YOUR_API_KEY\" });\n\n// list all videos (all pages)\nlet allVideos = [];\nfor(let currentPage=1 ; ; currentPage++) {\n  const res = await client.videos.list({ currentPage });\n  allVideos = [...allVideos, ...res.data];\n  if(currentPage >= res.pagination.pagesTotal) {\n    break;\n  }\n}\n\n// list videos that have all the given tags (only first results page)\nconst videosWithTags = await client.videos.list({ tags: [\"tag1\", \"tag2\"] });\n\n// list videos that have all the given metadata values (only first results page)\nconst videosWithMetadata = await client.videos.list({ metadata: { \"key1\": \"value1\", \"key2\": \"value2\" } })"
        - language: csharp
          code: '// First add the "ApiVideo" NuGet package to your project

            // Documentation: https://github.com/apivideo/api.video-csharp-client/blob/main/docs/VideosApi.md#list

            '
        - language: go
          code: '// First install the go client with "go get github.com/apivideo/api.video-go-client"

            // Documentation: https://github.com/apivideo/api.video-go-client/blob/main/docs/VideosApi.md#list

            '
        - language: python
          code: '# First install the api client with "pip install api.video"

            # Documentation: https://github.com/apivideo/api.video-python-client/blob/main/docs/VideosApi.md#list

            '
