    video:
      title: Video
      type: object
      properties:
        videoId:
          type: string
          description: The unique identifier of the video object.
          example: vi4k0jvEUuaTdRAEjQ4Prklg
        createdAt:
          type: string
          format: date-time
          description: When a video was created, presented in ATOM UTC format.
          example: '2024-05-28T11:15:07+00:00'
        title:
          type: string
          description: 'The title of the video content.

            '
          example: Maths video
        description:
          type: string
          description: 'A description for the video content.

            '
          example: An amazing video explaining string theory.
        publishedAt:
          type: string
          description: The date and time the API created the video. Date and time are provided using ATOM UTC format.
          format: date-time
          example: '2024-05-28T11:15:07+00:00'
        updatedAt:
          type: string
          description: The date and time the video was updated. Date and time are provided using ATOM UTC format.
          format: date-time
          example: '2024-05-28T11:15:07+00:00'
        discardedAt:
          type:
          - string
          - 'null'
          description: The date and time the video was discarded. The API populates this field only if you have the Video Restore feature enabled and discard a video. Date and time are provided using ATOM UTC format.
          format: date-time
          example: '2024-05-28T11:15:07+00:00'
        deletesAt:
          type:
          - string
          - 'null'
          description: The date and time the video will be permanently deleted. The API populates this field only if you have the Video Restore feature enabled and discard a video. Discarded videos are pemanently deleted after 90 days. Date and time are provided using ATOM UTC format.
          format: date-time
          example: '2024-05-28T11:15:07+00:00'
        discarded:
          type: boolean
          description: Returns `true` for videos you discarded when you have the Video Restore feature enabled. Returns `false` for every other video.
        language:
          type: string
          description: Returns the language of a video in [IETF language tag](https://en.wikipedia.org/wiki/IETF_language_tag) format. You can set the language during video creation via the API, otherwise it is detected automatically.
          example: en
        languageOrigin:
          type:
          - string
          - 'null'
          enum:
          - api
          - auto
          description: 'Returns the origin of the last update on the video''s `language` attribute.


            - `api` means that the last update was requested from the API.

            - `auto` means that the last update was done automatically by the API.'
          example: api
        tags:
          type: array
          description: "One array of tags (each tag is a string) in order to categorize a video. Tags may include spaces. \n"
          example: '"tags": ["maths", "string theory", "video"]'
          items:
            type: string
        metadata:
          type: array
          description: 'Metadata you can use to categorise and filter videos. Metadata is a list of dictionaries, where each dictionary represents a key value pair for categorising a video.

            '
          example: '[{"key":"Author", "value":"John Doe"}, {"key":"Format", "value":"Tutorial"}]'
          items:
            $ref: '#/components/schemas/metadata'
        source:
          $ref: '#/components/schemas/video-source'
        assets:
          $ref: '#/components/schemas/video-assets'
        playerId:
          type: string
          description: 'The id of the player that will be applied on the video.

            '
          example: pl45KFKdlddgk654dspkze
        public:
          type: boolean
          description: 'Defines if the content is publicly reachable or if a unique token is needed for each play session. Default is true. Tutorials on [private videos](https://api.video/blog/endpoints/private-videos/).

            '
          example: false
        panoramic:
          type: boolean
          description: 'Defines if video is panoramic.

            '
          example: false
        mp4Support:
          type: boolean
          description: 'This lets you know whether mp4 is supported. If enabled, an mp4 URL will be provided in the response for the video.

            '
          example: true
      required:
      - videoId
      example:
        videoId: vi4k0jvEUuaTdRAEjQ4Jfrgz
        title: Maths video
        description: An amazing video explaining the string theory
        language: en
        languageOrigin: api
        tags:
        - maths
        - string theory
        - video
        metadata:
        - key: Author
          value: John Doe
        - key: Format
          value: Tutorial
        createdAt: '2024-03-03T12:52:03+00:00'
        publishedAt: '2024-07-14T23:36:07+00:00'
        discarded: false
        discardedAt: null
        deletesAt: null
