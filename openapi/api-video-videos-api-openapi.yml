            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/video'
        '400':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bad-request'
              examples:
                Arttribute required:
                  value:
                    type: https://docs.api.video/reference/attribute-required
                    title: This attribute is required.
                    name: title
                    status: 400
                    problems:
                    - type: https://docs.api.video/reference/attribute-required
                      title: This attribute is required.
                      name: title
                    - type: https://docs.api.video/reference/invalid-attribute
                      title: This attribute must be a ISO-8601 date.
                      name: scheduledAt
                    - type: https://docs.api.video/reference/invalid-attribute
                      title: This attribute must be an array.
                      name: tags
                    - type: https://docs.api.video/reference/invalid-attribute
                      title: This attribute must be an array.
                      name: metadata
                Invalid language formatting:
                  description: This error occurs when the language tag you provided contains characters other than letters and dashes.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: The "language" attribute must contain only letters and dashes (for example "fr", "fr-BE").
                    name: language
                Invalid language:
                  description: This error occurs when the language tag you provided does not match any supported language.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: The "language" attribute is not valid.
                    name: language
        '429':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/too-many-requests'
              examples:
                Too many requests:
                  value:
                    type: https://docs.api.video/reference/too-many-requests
                    title: Too many requests.
                    status: 429
      security:
      - apiKey: []
      x-client-action: create
      x-doctave:
        code-samples:
        - language: go
          code: "// First install the go client with \"go get github.com/apivideo/api.video-go-client\"\n// Documentation: https://github.com/apivideo/api.video-go-client/blob/main/docs/VideosApi.md#create\n\npackage main\n\nimport (\n    \"context\"\n    \"fmt\"\n    \"os\"\n    apivideosdk \"github.com/apivideo/api.video-go-client\"\n)\n\nfunc main() {\n    client := apivideosdk.ClientBuilder(\"YOUR_API_KEY\").Build()\n    // if you rather like to use the sandbox environment:\n    // client := apivideosdk.SandboxClientBuilder(\"YOUR_SANDBOX_API_KEY\").Build()\n        \n    videoCreationPayload := *apivideosdk.NewVideoCreationPayload(\"Maths video\") // VideoCreationPayload | video to create\n\n    \n    res, err := client.Videos.Create(videoCreationPayload)\n\n    if err != nil {\n        fmt.Fprintf(os.Stderr, \"Error when calling `Videos.Create``: %v\\\n\", err)\n    }\n    // response from `Create`: Video\n    fmt.Fprintf(os.Stdout, \"Response from `Videos.Create`: %v\\\n\", res)\n}\n"
        - language: node
          code: "// First install the \"@api.video/nodejs-client\" npm package\n// Documentation: https://github.com/apivideo/api.video-nodejs-client/blob/main/doc/api/VideosApi.md#create\n\nconst client = new ApiVideoClient({ apiKey: \"YOUR_API_KEY\" });\n\n// create a simple video\nconst video = await client.videos.create({ title: \"Maths video\" });\n\n// create a video using an existing source\nconst existingSourceVideo = await client.videos.create({\n  title: \"Video using an existing source\", \n  source: \"https://www.myvideo.url.com/video.mp4\", \n});\n\n// create a private video\nconst privateVideo = await client.videos.create({\n  title: \"Video using an existing source\", \n  _public: false,\n});\n\n// create a video using all available attributes\nconst video = await client.videos.create({\n  title: \"Maths video\", // The title of your new video.\n  description: \"A video about string theory.\", // A brief description of your video.\n  source: \"https://www.myvideo.url.com/video.mp4\", // If you add a video already on the web, this is where you enter the url for the video.\n  _public: true, // Whether your video can be viewed by everyone, or requires authentication to see it. A setting of false will require a unique token for each view.\n  panoramic: false, // Indicates if your video is a 360/immersive video.\n  mp4Support: true, // Enables mp4 version in addition to streamed version.\n  playerId: \"pl45KFKdlddgk654dspkze\", // The unique identification number for your video player.\n  tags: [\"maths\", \"string theory\", \"video\"], // A list of tags you want to use to describe your video.\n  metadata: [{\"key\": \"Author\", \"value\": \"John Doe\"}], // A list of key value pairs that you use to provide metadata for your video. These pairs can be made dynamic, allowing you to segment your audience. You can also just use the pairs as another way to tag and categorize your videos.\n});\n"
        - language: php
          code: "<?php\n// First install the api client: \"composer require api-video/php-api-client\"\n// Documentation: https://github.com/apivideo/api.video-php-client/blob/main/docs/Api/VideosApi.md#create\n\nrequire __DIR__ . '/vendor/autoload.php';\n\n$client = new \\ApiVideo\\Client\\Client(\n    'https://ws.api.video',\n    'YOUR_API_KEY',\n    new \\Symfony\\Component\\HttpClient\\Psr18Client()\n);\n\n// create a simple video\n$video = $client->videos()->create((new \\ApiVideo\\Client\\Model\\VideoCreationPayload())->setTitle(\"Maths video\"));\n\n// create a video using an existing source\n$existingSourceVideo = $client->videos()->create((new \\ApiVideo\\Client\\Model\\VideoCreationPayload())\n    ->setTitle(\"Maths video\")\n    ->setSource(\"https://www.myvideo.url.com/video.mp4\"));\n\n// create a private video\n$privateVideo = $client->videos()->create((new \\ApiVideo\\Client\\Model\\VideoCreationPayload())\n    ->setTitle(\"Maths video\")\n    ->setPublic(false));\n\n// create a video using all available attributes\n$anotherVideo = $client->videos()->create((new \\ApiVideo\\Client\\Model\\VideoCreationPayload())\n    ->setTitle(\"Maths video\") // The title of your new video.\n    ->setDescription(\"A video about string theory.\") // A brief description of your video.\n    ->setSource(\"https://www.myvideo.url.com/video.mp4\") // If you add a video already on the web, this is where you enter the url for the video.\n    ->setPublic(true) // Whether your video can be viewed by everyone, or requires authentication to see it. A setting of false will require a unique token for each view.\n    ->setPanoramic(false) // Indicates if your video is a 360/immersive video.\n    ->setMp4Support(true) // Enables mp4 version in addition to streamed version.\n    ->setPlayerId(\"pl45KFKdlddgk654dspkze\") // The unique identification number for your video player.\n    ->setTags(array(\"TAG1\", \"TAG2\")) // A list of tags you want to use to describe your video.\n    ->setMetadata(array( // A list of key value pairs that you use to provide metadata for your video. These pairs can be made dynamic, allowing you to segment your audience. You can also just use the pairs as another way to tag and categorize your videos.\n        new \\ApiVideo\\Client\\Model\\Metadata(['key' => 'key1', 'value' => 'key1value1']),\n        new \\ApiVideo\\Client\\Model\\Metadata(['key' => 'key2', 'value' => 'key2value1']))));\n"
        - language: python
