openapi: 3.2.0
info:
  title: api.video Webhooks API
  description: api.video is an API that encodes on the go to facilitate immediate playback, enhancing viewer streaming experiences across multiple devices and platforms. You can stream live or on-demand online videos within minutes.
  version: '1'
servers:
- url: https://ws.api.video
  description: Production server
- url: https://sandbox.api.video
  description: Test server `all videos are watermarked, and deleted after 24 hours.
tags:
- name: Webhooks
paths:
  /webhooks:
    get:
      tags:
      - Webhooks
      summary: List all webhooks
      description: Retrieve a list of all webhooks configured for the current workspace.
      x-client-description:
        default: "Thie method returns a list of your webhooks (with all their details). \nYou can filter what the webhook list that the API returns using the parameters described below."
      operationId: LIST-webhooks
      parameters:
      - name: events
        in: query
        description: The webhook event that you wish to filter on.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: video.encoding.quality.completed
      - $ref: '#/components/parameters/current-page'
      - $ref: '#/components/parameters/page-size'
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks-list-response'
              examples:
                response:
                  value:
                    data:
                    - webhookId: webhook_XXXXXXXXXXXXXXX
                      createdAt: '2021-01-08T14:12:18+00:00'
                      events:
                      - video.encoding.quality.completed
                      url: http://clientnotificationserver.com/notif?myquery=query
                      signatureSecret: sig_sec_Abcd12348RLP7VPLi7nYVh
                    - webhookId: webhook_XXXXXXXXXYYYYYY
                      createdAt: '2021-01-12T12:12:12+00:00'
                      events:
                      - video.encoding.quality.completed
                      url: http://clientnotificationserver.com/notif?myquery=query2
                      signatureSecret: sig_sec_Abcd12358RLP7VPLi7nYVy
                    pagination:
                      currentPage: 1
                      pageSize: 25
                      pagesTotal: 1
                      itemsTotal: 2
                      currentPageItems: 2
                      links:
                      - rel: self
                        uri: https://ws.api.video/webhooks?currentPage=1
                      - rel: first
                        uri: https://ws.api.video/webhooks?currentPage=1
                      - rel: last
                        uri: https://ws.api.video/webhooks?currentPage=1
        '429':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/too-many-requests'
              examples:
                Too many requests:
                  value:
                    type: https://docs.api.video/reference/too-many-requests
                    title: Too many requests.
                    status: 429
      security:
      - apiKey: []
      x-group-parameters: true
      x-client-paginated: true
      x-optional-object: true
      x-client-action: list
      x-doctave:
        code-samples:
        - language: go
          code: "// First install the go client with \"go get github.com/apivideo/api.video-go-client\"\n// Documentation: https://github.com/apivideo/api.video-go-client/blob/main/docs/WebhooksApi.md#list\n\npackage main\n\nimport (\n    \"context\"\n    \"fmt\"\n    \"os\"\n    apivideosdk \"github.com/apivideo/api.video-go-client\"\n)\n\nfunc main() {\n    client := apivideosdk.ClientBuilder(\"YOUR_API_KEY\").Build()\n    // if you rather like to use the sandbox environment:\n    // client := apivideosdk.SandboxClientBuilder(\"YOUR_SANDBOX_API_KEY\").Build()\n    req := apivideosdk.WebhooksApiListRequest{}\n    \n    req.Events(\"video.encoding.quality.completed\") // string | The webhook event that you wish to filter on.\n    req.CurrentPage(int32(2)) // int32 | Choose the number of search results to return per page. Minimum value: 1 (default to 1)\n    req.PageSize(int32(30)) // int32 | Results per page. Allowed values 1-100, default is 25. (default to 25)\n\n    res, err := client.Webhooks.List(req)\n    \n\n    if err != nil {\n        fmt.Fprintf(os.Stderr, \"Error when calling `Webhooks.List``: %v\\\n\", err)\n    }\n    // response from `List`: WebhooksListResponse\n    fmt.Fprintf(os.Stdout, \"Response from `Webhooks.List`: %v\\\n\", res)\n}\n"
        - language: node
          code: "// First install the \"@api.video/nodejs-client\" npm package\n// Documentation: https://github.com/apivideo/api.video-nodejs-client/blob/main/doc/api/WebhooksApi.md#list\n\nconst client = new ApiVideoClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst events = 'video.encoding.quality.completed'; // The webhook event that you wish to filter on.\nconst currentPage = 2; // Choose the number of search results to return per page. Minimum value: 1\nconst pageSize = 30; // Results per page. Allowed values 1-100, default is 25.\n \nconst webhooks = await client.webhooks.list({ events, currentPage, pageSize }); "
        - language: python
          code: "# First install the api client with \"pip install api.video\"\n# Documentation: https://github.com/apivideo/api.video-python-client/blob/main/docs/WebhooksApi.md#list\n\nimport apivideo\nfrom apivideo.api import webhooks_api\nfrom apivideo.model.webhooks_list_response import WebhooksListResponse\nfrom pprint import pprint\n\n# Enter a context with an instance of the API client\nwith apivideo.AuthenticatedApiClient(__API_KEY__) as api_client:\n    # Create an instance of the API class\n    api_instance = webhooks_api.WebhooksApi(api_client)\n    events = \"video.encoding.quality.completed\" # str | The webhook event that you wish to filter on. (optional)\n    current_page = 2 # int | Choose the number of search results to return per page. Minimum value: 1 (optional) if omitted the server will use the default value of 1\n    page_size = 30 # int | Results per page. Allowed values 1-100, default is 25. (optional) if omitted the server will use the default value of 25\n\n    # example passing only required values which don't have defaults set\n    # and optional values\n    try:\n        # List all webhooks\n        api_response = api_instance.list(events=events, current_page=current_page, page_size=page_size)\n        pprint(api_response)\n    except apivideo.ApiException as e:\n        print(\"Exception when calling WebhooksApi->list: %s\\n\" % e)\n"
        - language: java
          code: "// First add the \"video.api:java-api-client\" maven dependency to your project\n// Documentation: https://github.com/apivideo/api.video-java-client/blob/main/docs/WebhooksApi.md#list\n\nimport video.api.client.ApiVideoClient;\nimport video.api.client.api.ApiException;\nimport video.api.client.api.models.*;\nimport video.api.client.api.clients.WebhooksApi;\nimport java.util.*;\n\npublic class Example {\n  public static void main(String[] args) {\n    ApiVideoClient client = new ApiVideoClient(\"YOUR_API_KEY\");\n    // if you rather like to use the sandbox environment:\n    // ApiVideoClient client = new ApiVideoClient(\"YOUR_SANDBOX_API_KEY\", ApiVideoClient.Environment.SANDBOX);\n\n    WebhooksApi apiInstance = client.webhooks();\n    \n    String events = \"video.encoding.quality.completed\"; // The webhook event that you wish to filter on.\n    Integer currentPage = 1; // Choose the number of search results to return per page. Minimum value: 1\n    Integer pageSize = 25; // Results per page. Allowed values 1-100, default is 25.\n\n    try {\n      Page<Webhook> result = apiInstance.list()\n            .events(events)\n            .currentPage(currentPage)\n            .pageSize(pageSize)\n            .execute();\n      System.out.println(result);\n    } catch (ApiException e) {\n      System.err.println(\"Exception when calling WebhooksApi#list\");\n      System.err.println(\"Status code: \" + e.getCode());\n      System.err.println(\"Reason: \" + e.getMessage());\n      System.err.println(\"Response headers: \" + e.getResponseHeaders());\n      e.printStackTrace();\n    }\n  }\n}\n"
        - language: csharp
          code: "// First add the \"ApiVideo\" NuGet package to your project\n// Documentation: https://github.com/apivideo/api.video-csharp-client/blob/main/docs/WebhooksApi.md#list\n\nusing System.Diagnostics;\nusing ApiVideo.Client;\n\nnamespace Example\n{\n    public class listExample\n    {\n        public static void Main()\n        {\n            var basePath = ApiVideoClient.Client.Environment.SANDBOX;\n            var apiKey = \"YOUR_API_KEY\";\n\n            var apiInstance = new ApiVideoClient(apiKey,basePath);\n\n            var events = video.encoding.quality.completed;  // string | The webhook event that you wish to filter on. (optional) \n            var currentPage = 2;  // int? | Choose the number of search results to return per page. Minimum value: 1 (optional)  (default to 1)\n            var pageSize = 30;  // int? | Results per page. Allowed values 1-100, default is 25. (optional)  (default to 25)\n            var apiWebhooksInstance = apiInstance.Webhooks();\n            try\n            {\n                // List all webhooks\n                WebhooksListResponse result = apiWebhooksInstance.list(events, currentPage, pageSize);\n                Debug.WriteLine(result);\n            }\n            catch (ApiException  e)\n            {\n                Debug.Print(\"Exception when calling WebhooksApi.list: \" + e.Message );\n                Debug.Print(\"Status Code: \"+ e.ErrorCode);\n                Debug.Print(e.StackTrace);\n            }\n        }\n    }\n}\n"
        - language: php
          code: '// First install the "@api.video/nodejs-client" npm package

            // Documentation: https://github.com/apivideo/api.video-nodejs-client/blob/main/doc/api/WebhooksApi.md#list


            const client = new ApiVideoClient({ apiKey: "YOUR_API_KEY" });


            const events = ''video.encoding.quality.completed''; // The webhook event that you wish to filter on.

            const currentPage = 2; // Choose the number of search results to return per page. Minimum value: 1

            const pageSize = 30; // Results per page. Allowed values 1-100, default is 25.


            // WebhooksListResponse

            const webhooks = await client.webhooks.list({ events, currentPage, pageSize }); '
        - language: swift
          code: '// First install the api client: https://github.com/apivideo/api.video-swift-client#getting-started

