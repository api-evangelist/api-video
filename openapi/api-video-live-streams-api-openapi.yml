openapi: 3.2.0
info:
  title: api.video Live Streams API
  description: api.video is an API that encodes on the go to facilitate immediate playback, enhancing viewer streaming experiences across multiple devices and platforms. You can stream live or on-demand online videos within minutes.
  version: '1'
servers:
- url: https://ws.api.video
  description: Production server
- url: https://sandbox.api.video
  description: Test server `all videos are watermarked, and deleted after 24 hours.
tags:
- name: Live Streams
paths:
  /live-streams:
    get:
      tags:
      - Live Streams
      summary: List all live streams
      description: Get the list of livestreams on the workspace.
      operationId: GET_live-streams
      parameters:
      - name: streamKey
        in: query
        description: The unique stream key that allows you to stream videos.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: dw-dew8-q6w9-k67w-1ws8
      - name: name
        in: query
        description: You can filter live streams by their name or a part of their name.
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: My Video
      - name: sortBy
        in: query
        description: 'Enables you to sort live stream results. Allowed attributes: `name`, `createdAt`, `updatedAt`.

          `name` - the name of the live stream.

          `createdAt` - the time a live stream was created.

          `updatedAt` - the time a live stream was last updated.


          When using `createdAt` or `updatedAt`, the API sorts the results based on the ATOM UTC time format.

          '
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - name
          - createdAt
          - updatedAt
        example: createdAt
      - name: sortOrder
        in: query
        description: 'Allowed: asc, desc. Ascending for date and time means that earlier values precede later ones. Descending means that later values preced earlier ones. For title, it is 0-9 and A-Z ascending and Z-A, 9-0 descending.'
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - asc
          - desc
        example: desc
      - $ref: '#/components/parameters/current-page'
      - $ref: '#/components/parameters/page-size'
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/live-stream-list-response'
              examples:
                response:
                  value:
                    data:
                    - liveStreamId: li400mYKSgQ6xs7taUeSaEKr
                      createdAt: '2020-01-31T10:17:47+00:00'
                      updatedAt: '2020-03-09T13:19:43+00:00'
                      streamKey: 30087931-229e-42cf-b5f9-e91bcc1f7332
                      restreams:
                      - name: YouTube
                        serverUrl: rtmp://youtube.broadcast.example.com
                        streamKey: cc1b4df0-d1c5-4064-a8f9-9f0368385188
                      - name: Twitch
                        serverUrl: rtmp://twitch.broadcast.example.com
                        streamKey: cc1b4df0-d1c5-4064-a8f9-9f0368385188
                      name: Live Stream From the browser
                      public: true
                      broadcasting: false
                      assets:
                        iframe: <iframe src="https://embed.api.video/live/li400mYKSgQ6xs7taUeSaEKr" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen=""></iframe>
                        player: https://embed.api.video/live/li400mYKSgQ6xs7taUeSaEKr
                        hls: https://live.api.video/li400mYKSgQ6xs7taUeSaEKr.m3u8
                        thumbnail: https://live.api.video/li400mYKSgQ6xs7taUeSaEKr/thumbnail.jpg
                    - liveStreamId: li4pqNqGUkhKfWcBGpZVLRY5
                      createdAt: '2020-07-29T10:45:35+00:00'
                      updatedAt: '2020-07-29T10:45:35+00:00'
                      streamKey: cc1b4df0-d1c5-4064-a8f9-9f0368385135
                      restreams:
                      - name: YouTube
                        serverUrl: rtmp://youtube.broadcast.example.com
                        streamKey: cc1b4df0-d1c5-4064-a8f9-9f0368385135
                      - name: Twitch
                        serverUrl: rtmp://twitch.broadcast.example.com
                        streamKey: cc1b4df0-d1c5-4064-a8f9-9f0368385135
                      name: Live From New York
                      public: true
                      broadcasting: false
                      assets:
                        iframe: <iframe src="https://embed.api.video/live/li4pqNqGUkhKfWcBGpZVLRY5" width="100%" height="100%" frameborder="0" scrolling="no" allowfullscreen=""></iframe>
                        player: https://embed.api.video/live/li4pqNqGUkhKfWcBGpZVLRY5
                        hls: https://live.api.video/li4pqNqGUkhKfWcBGpZVLRY5.m3u8
                        thumbnail: https://live.api.video/li4pqNqGUkhKfWcBGpZVLRY5/thumbnail.jpg
                    pagination:
                      currentPage: 1
                      currentPageItems: 19
                      pageSize: 25
                      pagesTotal: 1
                      itemsTotal: 19
                      links:
                      - rel: self
                        uri: /live-streams?currentPage=1&pageSize=25
                      - rel: first
                        uri: /live-streams?currentPage=1&pageSize=25
                      - rel: last
                        uri: /live-streams?currentPage=1&pageSize=25
        '429':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/too-many-requests'
              examples:
                Too many requests:
                  value:
                    type: https://docs.api.video/reference/too-many-requests
                    title: Too many requests.
                    status: 429
      security:
      - apiKey: []
      x-client-action: list
      x-group-parameters: true
      x-client-paginated: true
      x-optional-object: true
      x-doctave:
        code-samples:
        - language: go
          code: "// First install the go client with \"go get github.com/apivideo/api.video-go-client\"\n// Documentation: https://github.com/apivideo/api.video-go-client/blob/main/docs/LiveStreamsApi.md#list\n\npackage main\n  \n  import (\n      \"context\"\n      \"fmt\"\n      \"os\"\n      apivideosdk \"github.com/apivideo/api.video-go-client\"\n  )\n  \n  func main() {\n      client := apivideosdk.ClientBuilder(\"YOUR_API_KEY\").Build()\n      // if you rather like to use the sandbox environment:\n      // client := apivideosdk.SandboxClientBuilder(\"YOUR_SANDBOX_API_KEY\").Build()\n      req := apivideosdk.LiveStreamsApiListRequest{}\n      \n      req.StreamKey(\"30087931-229e-42cf-b5f9-e91bcc1f7332\") // string | The unique stream key that allows you to stream videos.\n      req.Name(\"My Video\") // string | You can filter live streams by their name or a part of their name.\n      req.SortBy(\"createdAt\") // string | Enables you to sort live stream results. Allowed attributes: `name`, `createdAt`, `updatedAt`.\n      req.SortOrder(\"desc\") // string | Allowed: asc, desc. Ascending for date and time means that earlier values precede later ones. Descending means that later values preced earlier ones. For title, it is 0-9 and A-Z ascending and Z-A, 9-0 descending.\n      req.CurrentPage(int32(2)) // int32 | Choose the number of search results to return per page. Minimum value: 1 (default to 1)\n      req.PageSize(int32(30)) // int32 | Results per page. Allowed values 1-100, default is 25. (default to 25)\n  \n      res, err := client.LiveStreams.List(req)\n      \n  \n      if err != nil {\n          fmt.Fprintf(os.Stderr, \"Error when calling `LiveStreams.List``: %v\\\n\", err)\n      }\n      // response from `List`: LiveStreamListResponse\n      fmt.Fprintf(os.Stdout, \"Response from `LiveStreams.List`: %v\\\n\", res)\n  }\n"
        - language: node
          code: "// First install the \"@api.video/nodejs-client\" npm package\n// Documentation: https://github.com/apivideo/api.video-nodejs-client/blob/main/doc/api/LiveStreamsApi.md#list\n\nconst client = new ApiVideoClient({ apiKey: \"YOUR_API_KEY\" });\n\n// retrieve the first page of all livestreams\nconst liveStreams = await client.liveStreams.list({ });\n\n// retrieve the livestreams having a given name\nconst liveStreams2 = await client.liveStreams.list({\n  name: 'My livestream'\n});\n\n// retrieve the livestreams having a given stream key\nconst liveStreams2 = await client.liveStreams.list({\n  streamKey:'30087931-229e-42cf-b5f9-e91bcc1f7332'\n});\n\n// retrieve the second page of 30 items sorted by name desc\nconst liveStreams3 = await client.liveStreams.list({\n  sortBy: 'name',\n  sortOrder: 'desc',\n  currentPage: 2,\n  pageSize: 30\n});\n"
        - language: python
          code: "# First install the api client with \"pip install api.video\"\n# Documentation: https://github.com/apivideo/api.video-python-client/blob/main/docs/LiveStreamsApi.md#list\n\nimport apivideo\nfrom apivideo.api import live_streams_api\nfrom apivideo.model.live_stream import LiveStream\nfrom pprint import pprint\n\n# Enter a context with an instance of the API client\nwith apivideo.AuthenticatedApiClient(__API_KEY__) as api_client:\n    # Create an instance of the API class\n    api_instance = live_streams_api.LiveStreamsApi(api_client)\n    live_stream_id = \"li400mYKSgQ6xs7taUeSaEKr\" # str | The unique ID for the live stream you want to watch.\n\n    # example passing only required values which don't have defaults set\n    try:\n        # Show live stream\n        api_response = api_instance.get(live_stream_id)\n        pprint(api_response)\n    except apivideo.ApiException as e:\n        print(\"Exception when calling LiveStreamsApi->get: %s\\n\" % e)\n"
        - language: java
          code: "// First add the \"video.api:java-api-client\" maven dependency to your project\n// Documentation: https://github.com/apivideo/api.video-java-client/blob/main/docs/LiveStreamsApi.md#list\n\nimport video.api.client.ApiVideoClient;\nimport video.api.client.api.ApiException;\nimport video.api.client.api.models.*;\nimport video.api.client.api.clients.LiveStreamsApi;\nimport java.util.*;\n\npublic class Example {\n  public static void main(String[] args) {\n    ApiVideoClient client = new ApiVideoClient(\"YOUR_API_KEY\");\n    // if you rather like to use the sandbox environment:\n    // ApiVideoClient client = new ApiVideoClient(\"YOUR_SANDBOX_API_KEY\", ApiVideoClient.Environment.SANDBOX);\n\n    LiveStreamsApi apiInstance = client.liveStreams();\n    \n    String streamKey = \"30087931-229e-42cf-b5f9-e91bcc1f7332\"; // The unique stream key that allows you to stream videos.\n    String name = \"My Video\"; // You can filter live streams by their name or a part of their name.\n    String sortBy = \"createdAt\"; // Enables you to sort live stream results. Allowed attributes: `name`, `createdAt`, `updatedAt`.\n    String sortOrder = \"desc\"; // Allowed: asc, desc. Ascending for date and time means that earlier values precede later ones. Descending means that later values preced earlier ones. For title, it is 0-9 and A-Z ascending and Z-A, 9-0 descending.\n    Integer currentPage = 1; // Choose the number of search results to return per page. Minimum value: 1\n    Integer pageSize = 25; // Results per page. Allowed values 1-100, default is 25.\n\n    try {\n      Page<LiveStream> result = apiInstance.list()\n            .streamKey(streamKey)\n            .name(name)\n            .sortBy(sortBy)\n            .sortOrder(sortOrder)\n            .currentPage(currentPage)\n            .pageSize(pageSize)\n            .execute();\n      System.out.println(result);\n    } catch (ApiException e) {\n      System.err.println(\"Exception when calling LiveStreamsApi#list\");\n      System.err.println(\"Status code: \" + e.getCode());\n      System.err.println(\"Reason: \" + e.getMessage());\n      System.err.println(\"Response headers: \" + e.getResponseHeaders());\n      e.printStackTrace();\n    }\n  }\n}\n"
        - language: csharp
          code: "// First add the \"ApiVideo\" NuGet package to your project\n// Documentation: https://github.com/apivideo/api.video-csharp-client/blob/main/docs/LiveStreamsApi.md#list\n\nusing System.Diagnostics;\nusing ApiVideo.Client;\n\nnamespace Example\n{\n    public class getExample\n    {\n        public static void Main()\n        {\n            var basePath = ApiVideoClient.Client.Environment.SANDBOX;\n            var apiKey = \"YOUR_API_KEY\";\n\n            var apiInstance = new ApiVideoClient(apiKey,basePath);\n\n            var liveStreamId = li400mYKSgQ6xs7taUeSaEKr;  // string | The unique ID for the live stream you want to watch.\n            var apiLiveStreamsInstance = apiInstance.LiveStreams();\n            try\n            {\n                // Show live stream\n                LiveStream result = apiLiveStreamsInstance.get(liveStreamId);\n                Debug.WriteLine(result);\n            }\n            catch (ApiException  e)\n            {\n                Debug.Print(\"Exception when calling LiveStreamsApi.get: \" + e.Message );\n                Debug.Print(\"Status Code: \"+ e.ErrorCode);\n                Debug.Print(e.StackTrace);\n            }\n        }\n    }\n}\n"
        - language: php
          code: "<?php\n// First install the api client: \"composer require api-video/php-api-client\"\n// Documentation: https://github.com/apivideo/api.video-php-client/blob/main/docs/Api/LiveStreamsApi.md#list\n\nrequire __DIR__ . '/vendor/autoload.php';\n\n$client = new \\ApiVideo\\Client\\Client(\n    'https://ws.api.video',\n    'YOUR_API_KEY',\n    new \\Symfony\\Component\\HttpClient\\Psr18Client()\n); \n\n// retrieve the first page of all livestreams\n$liveStreams = $client->liveStreams()->list();\n\n// retrieve the livestreams having a given name\n$liveStreams2 = $client->liveStreams()->list(array(\n    'name' => 'My livestream'\n));\n\n// retrieve the livestreams having a given stream key\n$liveStreams2 = $client->liveStreams()->list(array(\n  'streamKey' => '30087931-229e-42cf-b5f9-e91bcc1f7332'\n));\n\n// retrieve the second page of 30 items sorted by name desc\n$liveStreams3 = $client->liveStreams()->list(array(\n    'sortBy' => 'name',\n    'sortOrder' => 'desc',\n    'currentPage' => 2,\n    'pageSize' => 30\n)); "
        - language: swift
          code: '// First install the api client: https://github.com/apivideo/api.video-swift-client#getting-started

            // Documentation: https://github.com/apivideo/api.video-swift-client/blob/main/docs/LiveStreamsAPI.md#list

            '
    post:
      tags:
      - Live Streams
      summary: Create live stream
      description: Creates a livestream object.
      operationId: POST_live-streams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/live-stream-creation-payload'
      responses:
        '200':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/live-stream'
              examples:
                live-stream-response-example:
                  $ref: '#/components/examples/live-stream-response-example'
        '400':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bad-request'
              examples:
                Empty field in restreams array:
                  description: This error occurs when a field is empty in the `restreams` array in your request.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: This value should not be blank.
                    name: restreams[0][name]
                Missing app name in serverUrl:
                  description: This error occurs when the app name is missing from `serverURL` in the `restreams` array.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: 'Missing app name: [rtmp|rtmps]://[host]/[app name].'
                    name: restreams[0][serverUrl]
                Incorrect URL in serverUrl:
                  description: This error occurs when the URL you set in `serverURL` is not `rtmps` or `rtmp`.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: 'RTMP URL should have the following format: [rtmp|rtmps]://[host]/[app name].'
                    name: restreams[0][serverUrl]
                Too many restream destinations:
                  description: This error occurs when you set more than 5 restream destinations.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: This collection should contain 5 elements or less.
                    name: restreams
                null field in the restreams array:
                  description: This error occurs when a field is sent as `null` in the `restreams` array in your request.
                  value:
                    type: https://docs.api.video/reference/invalid-attribute
                    title: An attribute is invalid.
                    status: 400
                    detail: This value should not be null.
                    name: restreams[0][name]
        '429':
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The request limit per minute.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of available requests left for the current time window.
            X-RateLimit-Retry-After:
              schema:
                type: integer
              description: The number of seconds left until the current rate limit window resets.
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/too-many-requests'
              examples:
                Too many requests:
                  value:
                    type: https://docs.api.video/reference/too-many-requests
                    title: Too many requests.
                    status: 429
      security:
      - apiKey: []
      x-client-action: create
      x-doctave:
        code-samples:
        - language: go
          code: "// First install the go client with \"go get github.com/apivideo/api.video-go-client\"\n// Documentation: https://github.com/apivideo/api.video-go-client/blob/main/docs/LiveStreamsApi.md#create\n\n                  \n// instantiate the client \nclient := apivideosdk.ClientBuilder(\"YOUR_API_KEY\").Build()\n\nliveStreamCreationPayload := apivideosdk.LiveStreamCreationPayload{}\nliveStreamCreationPayload.SetName(\"My Live Stream Video\") // Add a name for your live stream here.\nliveStreamCreationPayload.SetPublic(true) // Whether your video can be viewed by everyone, or requires authentication to see it.\nliveStreamCreationPayload.SetPlayerId(\"pl4f4ferf5erfr5zed4fsdd\") // The unique identifier for the player.\nliveStreamCreatePayload.SetRestreams([]RestreamsRequestObject{{Name: \"My RTMP server\", ServerUrl: \"rtmp://my.broadcast.example.com/app\", StreamKey: \"dw-dew8-q6w9-k67w-1ws8\"}}) // Use this parameter to add, edit, or remove RTMP services where you want to restream a live stream. The list can only contain up to 5 destinations.\n\nres, err := client.LiveStreams.Create(liveStreamCreationPayload)\n\nif err != nil {\n    fmt.Fprintf(os.Stderr, \"Error when calling `LiveStreams.Create``: %v\", err)\n}\n\nfmt.Fprintf(os.Stdout, \"Response from `LiveStreams.Create`: %v\", res)\n"
        - language: node
          code: "// First install the \"@api.video/nodejs-client\" npm package\n// Documentation: https://github.com/apivideo/api.video-nodejs-client/blob/main/doc/api/LiveStreamsApi.md#create\n\nconst client = new ApiVideoClient({ apiKey: \"YOUR_API_KEY\" });\n\nconst liveStreamCreationPayload = {\n    name: \"My Live Stream\", // Add a name for your live stream here.\n    _public: true, // Whether your video can be viewed by everyone, or requires authentication to see it. \n    playerId: \"pl4f4ferf5erfr5zed4fsdd\", // The unique identifier for the player.\n    restreams: [ // Use this parameter to add, edit, or remove RTMP services where you want to restream a live stream. The list can only contain up to 5 destinations.\n      {\n        streamKey: \"dw-dew8-q6w9-k67w-1ws8\",\n        serverUrl: \"rtmp://my.broadcast.example.com/app\",\n        name: \"My RTMP server\",\n      },\n    ],\n}; \n\nconst liveStream = await client.liveStreams.create(liveStreamCreationPayload);\n"
        - language: python
          code: "# First install the api client with \"pip install api.video\"\n# Documentation: https://github.com/apivideo/api.video-python-client/blob/main/docs/LiveStreamsApi.md#create\n\nfrom apivideo.api.live_streams_api import LiveStreamsApi\nfrom apivideo.model.live_stream_creation_payload import LiveStreamCreationPayload\nfrom apivideo import AuthenticatedApiClient, ApiException\n\nwith AuthenticatedApiClient(\"YOUR_API_KEY\") as api_client:\n    live_stream_creation_payload = LiveStreamCreationPayload(\n        name=\"My Live Stream Video\",\n        public=True,\n        player_id=\"pl4f4ferf5erfr5zed4fsdd\",\n        restreams=[\n            RestreamsRequestObject(\n                name=\"My RTMP server\",\n                server_url=\"rtmp://my.broadcast.example.com/app\",\n                stream_key=\"dw-dew8-q6w9-k67w-1ws8\",\n            ),\n        ],\n    ) # LiveStreamCreationPayload | \n\n    try:\n        live_stream = LiveStreamsApi(api_client).create(live_stream_creation_payload)\n        print(live_stream)\n    except ApiException as e:\n        print(\"Exception when calling LiveStreamsApi->create: %s\" % e)\n"
        - language: java
          code: "// First add the \"video.api:java-api-client\" maven dependency to your project\n// Documentation: https://github.com/apivideo/api.video-java-client/blob/main/docs/LiveStreamsApi.md#create\n\n                  \n// instantiate the client \nApiVideoClient client = new ApiVideoClient(\"YOUR_API_KEY\");\n\nLiveStreamCreationPayload liveStreamCreationPayload = new LiveStreamCreationPayload(); \nliveStreamCreationPayload.setName(\"My Live Stream Video\"); // Add a name for your live stream here.\nliveStreamCreationPayload.setPublic(); // Whether your video can be viewed by everyone, or requires authentication to see it.\nliveStreamCreationPayload.setPlayerId(\"pl4f4ferf5erfr5zed4fsdd\"); // The unique identifier for the player.\nliveStreamCreationPayload.setRestreams(Collections.singletonList(new RestreamsRequestObject() // Use this parameter to add, edit, or remove RTMP services where you want to restream a live stream. The list can only contain up to 5 destinations.\n      .name(\"My RTMP server\")\n      .serverUrl(\"rtmp://my.broadcast.example.com/app\")\n      .streamKey(\"dw-dew8-q6w9-k67w-1ws8\")));\n\n\ntry {\n    LiveStream liveStream = client.liveStreams().create(liveStreamCreationPayload);\n    System.out.println(liveStream);\n} catch (ApiException e) {\n    e.printStackTrace();\n}\n"
        - language: csharp
