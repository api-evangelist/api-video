    post:
      tags:
      - Chapters
      summary: Upload a chapter
      description: 'Upload a VTT file to add chapters to your video.

        Chapters help break the video into sections. Read our tutorial for more details.'
      operationId: POST_videos-videoId-chapters-language
      parameters:
      - name: videoId
        in: path
        description: The unique identifier for the video you want to upload a chapter for.
