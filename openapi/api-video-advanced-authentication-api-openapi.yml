  /auth/refresh:
    post:
      tags:
      - Advanced authentication
      summary: Refresh Bearer Token
      description: 'Accepts the old bearer token and returns a new bearer token that can be used to authenticate other endpoint.


        You can find the tutorial on using the disposable bearer token here.'
