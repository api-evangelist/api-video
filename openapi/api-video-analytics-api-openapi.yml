components:
  parameters:
    current-page:
      name: currentPage
      in: query
      description: 'Choose the number of search results to return per page. Minimum value: 1'
      required: false
      style: form
      explode: true
      schema:
        type: integer
        default: 1
      example: 2
    page-size:
      name: pageSize
      in: query
      description: Results per page. Allowed values 1-100, default is 25.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        default: 25
      example: 30
    filterBy:
      name: filterBy
      description: "Use this parameter to filter the API's response based on different data dimensions. You can serialize filters in your query to receive more detailed breakdowns of your analytics.\n\n- If you do not set a value for `filterBy`, the API returns the full dataset for your project.\n- The API only accepts the `mediaId` and `mediaType` filters when you call `/data/metrics/play/total` or `/data/buckets/play-total/media-id`.\n\nThese are the available breakdown dimensions:\n\n- `mediaId`: Returns analytics based on the unique identifiers of a video or a live stream.\n- `mediaType`: Returns analytics based on the type of content. Possible values: `video` and `live-stream`. \n- `continent`: Returns analytics based on the viewers' continent. The list of supported continents names are based on the [GeoNames public database](https://www.geonames.org/countries/). You must use the ISO-3166 alpha2 format, for example `EU`. Possible values are: `AS`, `AF`, `NA`, `SA`, `AN`, `EU`, `AZ`. \n- `country`: Returns analytics based on the viewers' country. The list of supported country names are based on the [GeoNames public database](https://www.geonames.org/countries/). You must use the ISO-3166 alpha2 format, for example `FR`.\n- `deviceType`: Returns analytics based on the type of device used by the viewers. Response values can include: `computer`, `phone`, `tablet`, `tv`, `console`, `wearable`, `unknown`.\n- `operatingSystem`: Returns analytics based on the operating system used by the viewers. Response values can include `windows`, `mac osx`, `android`, `ios`, `linux`.\n- `browser`: Returns analytics based on the browser used by the viewers. Response values can include `chrome`, `firefox`, `edge`, `opera`.\n- `tag`: Returns analytics for videos using this tag. This filter only accepts a single value and is case sensitive. Read more about tagging your videos [here](https://docs.api.video/vod/tags-metadata).\n- `referrer`: Filters data based on the URL where the view is originating from. Accepts an empty string as a value to filter view events where no referrer is available.\n"
      in: query
      required: false
      example: filterBy[country]=FR&filterBy[operatingSystem]=windows&filterBy[browser][]=firefox&filterBy[browser][]=chrome&filterBy[tag]=Cool videos
      style: deepObject
      x-is-deep-object: true
      explode: true
      schema:
        x-is-deep-object: true
        type: object
        properties:
          mediaId:
            type: array
            items:
              type: string
            description: Returns analytics based on the unique identifiers of a video or a live stream.
            example:
            - vi4blUQJFrYWbaG44NChkH27
          mediaType:
            type: string
            enum:
            - video
            - live-stream
            example: video
          continent:
            type: array
            items:
              type: string
              enum:
              - AS
              - AF
              - NA
              - SA
              - AN
              - EU
              - AZ
            description: Returns analytics based on the viewers' continent. The list of supported continents names are based on the [GeoNames public database](https://www.geonames.org/countries/). You must use the ISO-3166 alpha2 format, for example `EU`.
            example:
            - EU
          country:
            description: Returns analytics based on the viewers' country. The list of supported country names are based on the [GeoNames public database](https://www.geonames.org/countries/). You must use the ISO-3166 alpha2 format, for example `FR`.
            type: array
            items:
              type: string
            example:
            - FR
          deviceType:
            type: array
            items:
              type: string
            description: 'Returns analytics based on the type of device used by the viewers. Response values can include: `computer`, `phone`, `tablet`, `tv`, `console`, `wearable`, `unknown`.'
            example:
            - computer
          operatingSystem:
            type: array
            items:
              type: string
            description: Returns analytics based on the operating system used by the viewers. Response values can include `windows`, `mac osx`, `android`, `ios`, `linux`.
            example:
            - windows
          browser:
            description: Returns analytics based on the browser used by the viewers. Response values can include `chrome`, `firefox`, `edge`, `opera`.
            type: array
            items:
              type: string
            example:
            - firefox
          tag:
            type: string
            description: Returns analytics for videos using this tag. This filter only accepts a single value and is case sensitive. Read more about tagging your videos [here](https://docs.api.video/vod/tags-metadata).
            example: Cool videos
          referrer:
            type: array
            items:
              type: string
              format: uri
              maxLength: 2048
            description: 'Filters data based on the URL where the view is originating from. This filter parameter accepts an empty string to filter view events where no referrer is available.


              - The API filters for exact matches. Include the trailing `/` characters if needed.

              - The URLs you add must be URL encoded.'
            example:
            - https%3A%2F%2Fmy-awesome-videos.com
