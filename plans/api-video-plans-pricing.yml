description: api.video prices platform usage directly - free encoding, then per-minute charges for video stored and video delivered - with two tiers (Pay as you go, Enterprise) that differ in API rate limits, audit-log retention, isolated storage, security reviews, SLA and contract terms, plus priced add-ons (custom domain, domain referrer, Video Restore, analytics retention, AI transcription and summarization). Replaces the 2026-05-04 scaffold, whose Free/Pro/Enterprise tiers and quotas were never published by the provider.
