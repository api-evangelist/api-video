    price_text: The abstract cost is $0,10 per minute of video and takeaways are $0,05 per minute of video
  - name: 3 months Analytics Retention
    price_text: "1-1,000 plays: $12 /month | 1,001-10,000 plays: $49 /month | 10,000+ plays: $99 /month"
  - name: 12 months Analytics Retention
    price_text: "1-1,000 plays: $36 /month | 1,001-10,000 plays: $149 /month | 10,000+ plays: $299 /month"
note: The pricing page also states "No commitments or credit card required" for getting started and offers a calculator comparing against AWS, GCP and Oracle; volume discounts are referenced but not priced on the page. The enterprise page (https://api.video/enterprise/) quotes a 99.999% SLA where the pricing page quotes 99.9%.
