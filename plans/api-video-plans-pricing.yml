billing_unit: per minute of video stored (hosting) and per minute of video delivered; encoding is free
plans:
  - id: api-video-pay-as-you-go
    name: Pay as you go
    type: usage
    description: Self-serve tier. No commitments or credit card required to start (sandbox); production is billed monthly on usage with free encoding at any resolution up to 4K.
    price_text: Video Hosting as low as $0.00285 PER MINUTE OF VIDEO STORED
    price: 0.00285
    price_unit: USD per minute of video stored
    prices:
      - {component: encoding, price_text: Video Encoding FREE FOR UNLIMITED MINUTES, price: 0}
      - {component: hosting, price_text: Video Hosting as low as $0.00285 PER MINUTE OF VIDEO STORED, price: 0.00285}
      - {component: delivery, price_text: Video Delivery as low as $0.0017 PER MINUTE OF VIDEO DELIVERED, price: 0.0017}
    billing: monthly
    features:
      - Audit Logs (up to 5 days)
      - No isolated storage
      - No security review
      - Public Terms
      - "Payment options: Credit card, Apple Pay, SEPA (on request), Monthly billing"
      - Free encoding from 240p to 4K, HLS and MP4 output, adaptive delivery
      - Customizable player, upload by URL, webhooks, metadata and tagging, 1 month analytics retention
    limits:
      - {name: Upload API calls, limit_text: 100 Upload API calls/min, max: 100, window: 1 minute}
      - {name: Write API calls, limit_text: 200 Write API calls/min, max: 200, window: 1 minute}
      - {name: Read API calls, limit_text: 500 Read API calls/min, max: 500, window: 1 minute}
    sla: N/A
  - id: api-video-enterprise
    name: Enterprise plan
    type: enterprise
    description: Negotiated contract with higher API rate limits, 60-day audit logs plus domain referrer, isolated storage, included security reviews, SLA with credits, and signed MSA/SLA/DPA; paid by wire transfer with annual billing.
    price_text: Contact Us
    price: Contact Us
    features:
      - Audit Logs (up to 60 days) & Domain Referrer
      - Isolated storage available
      - Security review included
      - 99.9% SLA + SLA credits
      - Signed MSA, SLA, DPA
      - "Payment options: Wire transfer, Annual billing, Payment schedules"
    limits:
      - {name: Upload API calls, limit_text: 200 Upload API calls/min, max: 200, window: 1 minute}
      - {name: Write API calls, limit_text: 1000 Write API calls/min, max: 1000, window: 1 minute}
      - {name: Read API calls, limit_text: 2500 Read API calls/min, max: 2500, window: 1 minute}
    sla: 99.9% + SLA credits
